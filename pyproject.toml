[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-claims-platform"
version = "0.1.0"
description = "Probabilistic P&C claims forecasting and adjuster workforce optimization"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2", "scikit-learn>=1.5", "scipy>=1.13", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "pandas-stubs"]
gcp = ["google-cloud-bigquery>=3.25", "google-cloud-pubsub>=2.23", "google-cloud-storage>=2.18", "google-cloud-aiplatform>=1.70"]

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_claims_platform"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

